name: CD

on:
  workflow_call:

jobs:
  deploy-to-aks:
    strategy:
      matrix:
        org:
          - fintlabs-no
        cluster:
          - aks-beta-fint-2021-11-23
        component:
          - utdanning-elev
          - utdanning-vurdering
          - utdanning-utdanningsprogram
          - personvern-kodeverk
          - personvern-samtykke

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get environment
        uses: actions/github-script@v6
        id: environment
        with:
          script: return '${{ matrix.cluster }}'.split('-')[1]
          result-encoding: string

      - name: Get resource group name
        uses: actions/github-script@v6
        id: resource-group
        with:
          script: return 'rg-aks-${{ steps.environment.outputs.result }}'
          result-encoding: string

      - name: Check if kustomize path exists
        id: kustomize-check
        run: |
          KUSTOMIZE_PATH="kustomize/${{ steps.environment.outputs.result }}/${{ matrix.component }}/${{ matrix.org }}"

          echo "path=$KUSTOMIZE_PATH" >> $GITHUB_OUTPUT

          if [ -d "$KUSTOMIZE_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Found $KUSTOMIZE_PATH"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping $KUSTOMIZE_PATH (does not exist)"
          fi

      - name: Bake manifests with Kustomize
        if: steps.kustomize-check.outputs.exists == 'true'
        id: bake
        uses: azure/k8s-bake@v2.4
        with:
          renderEngine: kustomize
          kustomizationPath: ${{ steps.kustomize-check.outputs.path }}

      - uses: azure/login@v3
        with:
          creds: "${{ secrets[format('AKS_{0}_FINT_GITHUB', 'BETA')] }}"

      - name: Set the target cluster
        uses: azure/aks-set-context@v5
        with:
          cluster-name: "${{ matrix.cluster}}"
          resource-group: "${{ steps.resource-group.outputs.result }}"
          admin: "true"
          use-kubelogin: "true"

      - name: Get latest RC image
        if: steps.kustomize-check.outputs.exists == 'true'
        id: image
        shell: bash
        run: |
          set -euo pipefail

          RC_REGEX='^v?[0-9]+\.[0-9]+\.[0-9]+-rc[-.][0-9]+$'

          IMAGE_TAG=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              --paginate \
              --slurp \
              "/orgs/fintlabs/packages/container/fint-core-consumer/versions?per_page=100" \
            | jq -r --arg rc "$RC_REGEX" '
                [
                  .[][]
                  | {
                      updated_at,
                      tag: ((.metadata.container.tags // [])[] | select(test($rc)))
                    }
                ]
                | sort_by(.updated_at)
                | last
                | .tag // empty
              '
          )

          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::Fant ingen RC-tag som matcher regex: $RC_REGEX"
            exit 1
          fi

          IMAGE="ghcr.io/fintlabs/fint-core-consumer:$IMAGE_TAG"

          echo "Found image: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy
        if: steps.kustomize-check.outputs.exists == 'true'
        uses: azure/k8s-deploy@v4.9
        with:
          action: deploy
          manifests: ${{ steps.bake.outputs.manifestsBundle }}

          images: |
            ${{ steps.image.outputs.image }}

          namespace: ${{ matrix.org }}
